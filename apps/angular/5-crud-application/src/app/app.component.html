@if (loading()) {
  <app-loader />
}

@if (error()) {
  <div class="error">
    <app-error-message
      class="error__message"
      [message]="error()"
      data-test="error-message" />
    <button class="reload-btn" (click)="reloadData()" data-test="reload-button">
      Reload
    </button>
  </div>
}

@for (todo of todos(); track $index) {
  <todo
    [data]="todo"
    [isBusy]="todo.id === state().isUpdating"
    (delete)="delete($event)"
    (update)="update($event)" />
}
